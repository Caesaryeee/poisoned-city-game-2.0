<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Out of the Poisoned City - An Interactive Narrative</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,700;1,400&family=Orbitron:wght@700;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="text-gray-200 selection:bg-cyan-900">

    <!-- Boot Screen -->
    <div id="boot-screen" class="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center cursor-pointer">
        <p class="text-gray-400 font-mono text-xs md:text-sm tracking-[0.4em] uppercase mb-4 text-center">A Mingzi Ye
            Interactive Story</p>
        <h1 class="glitch text-4xl md:text-6xl font-bold text-cyan-500 mb-12 tracking-[0.2em] uppercase text-center drop-shadow-[0_0_15px_rgba(6,182,212,0.6)]"
            data-text="Out of the Poisoned City">
            Out of the<br>Poisoned City</h1>
        <p class="text-gray-500 font-mono text-sm md:text-base animate-pulse text-center">[ Neural Link Ready / Click
            Anywhere to Interface ]</p>
    </div>

    <!-- Background Rain Audio -->
    <audio id="bgm-rain" loop preload="auto">
        <source
            src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_349dcc813e.mp3?filename=heavy-rain-nature-sounds-8186.mp3"
            type="audio/mpeg">
    </audio>

    <!-- Core 16:9 Canvas Container -->
    <div id="game-container"
        class="aspect-16-9-container shadow-2xl transition-shadow duration-500 border border-gray-800/50">

        <!-- Base Layer: Fullscreen Background Image -->
        <img id="scene-image"
            src="https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=1600&auto=format&fit=crop"
            alt="Cyberpunk Scene" class="absolute inset-0 object-cover w-full h-full opacity-0 z-0" />

        <!-- Atmosphere Layers: Vignette, Scanlines & Damage Filter -->
        <div
            class="absolute inset-0 z-0 pointer-events-none bg-gradient-to-b from-black/20 via-transparent to-black/60">
        </div>
        <!-- Ending-specific color vignette (hidden by default) -->
        <div id="ending-color-overlay"
            class="absolute inset-0 z-1 pointer-events-none opacity-0 transition-opacity duration-1000"></div>
        <div class="absolute inset-0 z-10 pointer-events-none box-shadow-vignette"
            style="box-shadow: inset 0 0 150px rgba(0,0,0,0.8);"></div>
        <div class="absolute inset-0 z-10 pointer-events-none bg-scanline opacity-30 mix-blend-overlay"></div>
        <div id="damage-overlay"
            class="absolute inset-0 z-20 bg-red-600/30 mix-blend-color-burn opacity-0 transition-opacity duration-300 pointer-events-none">
        </div>

        <!-- 跳过打字机动画提示 -->
        <div id="skip-hint"
            class="absolute bottom-5 right-6 z-40 pointer-events-none opacity-0 transition-opacity duration-700">
            <span class="font-mono text-xs tracking-[0.3em] uppercase text-gray-400 animate-pulse select-none">
                [ click to skip ]
            </span>
        </div>


        <!-- Ending Badge — has gradient background so scrolling text fades behind it -->
        <div id="ending-badge"
            class="absolute top-0 left-0 right-0 z-50 flex flex-col items-center justify-center pt-8 md:pt-10 pb-14 opacity-0 pointer-events-none bg-gradient-to-b from-black/95 via-black/75 to-transparent backdrop-blur-sm">
            <div id="ending-badge-inner" class="flex flex-col items-center space-y-1">
                <div class="flex items-center space-x-3 mb-2">
                    <div class="h-px w-12 md:w-20 bg-current opacity-60"></div>
                    <span id="ending-badge-label"
                        class="font-mono text-xs md:text-sm tracking-[0.5em] uppercase font-bold">&mdash; ENDING
                        &mdash;</span>
                    <div class="h-px w-12 md:w-20 bg-current opacity-60"></div>
                </div>
                <h2 id="ending-badge-title"
                    class="text-2xl md:text-4xl font-black tracking-widest text-center px-4 drop-shadow-[0_0_20px_currentColor]">
                </h2>
            </div>
        </div>

        <!-- Top Info Bar (Absolute, for story pages) -->
        <header id="header-bar"
            class="absolute top-0 w-full p-4 md:p-6 z-30 flex items-center justify-between bg-gradient-to-b from-black/80 to-transparent pointer-events-none transition-opacity duration-1000">
            <h1 class="text-sm md:text-lg font-bold tracking-[0.3em] text-transparent bg-clip-text bg-gradient-to-r from-gray-200 to-gray-500"
                id="header-title">
                [ KAY'S PERSONAL TERMINAL ]
            </h1>
            <div class="flex items-center gap-3 md:gap-5">
                <!-- Volume Control -->
                <div id="volume-control" class="flex items-center gap-1.5 pointer-events-auto">
                    <button id="vol-btn"
                        class="text-gray-500 hover:text-gray-200 transition-colors duration-300 cursor-pointer flex-shrink-0">
                        <i data-lucide="volume-2" class="w-3.5 h-3.5 md:w-4 md:h-4"></i>
                    </button>
                    <div id="vol-bars" class="flex items-end gap-[3px]">
                        <div class="vol-bar w-1 rounded-sm cursor-pointer transition-colors duration-200"
                            style="height:5px" data-level="1"></div>
                        <div class="vol-bar w-1 rounded-sm cursor-pointer transition-colors duration-200"
                            style="height:7px" data-level="2"></div>
                        <div class="vol-bar w-1 rounded-sm cursor-pointer transition-colors duration-200"
                            style="height:9px" data-level="3"></div>
                        <div class="vol-bar w-1 rounded-sm cursor-pointer transition-colors duration-200"
                            style="height:11px" data-level="4"></div>
                        <div class="vol-bar w-1 rounded-sm cursor-pointer transition-colors duration-200"
                            style="height:13px" data-level="5"></div>
                    </div>
                </div>
                <!-- Status indicator (dynamically updated by game.js) -->
                <div class="flex items-center space-x-2 text-xs md:text-sm font-mono" id="header-node-info">
                    <i data-lucide="radio" class="w-4 h-4 md:w-5 md:h-5 animate-pulse"></i>
                    <span class="tracking-widest opacity-70">SIGNAL SECURE</span>
                </div>
            </div>
        </header>


        <!-- Core Content Area -->
        <div id="content-wrapper"
            class="absolute inset-0 w-full h-full z-30 flex flex-col justify-end transition-all duration-1000 pointer-events-none">

            <div id="story-content-box"
                class="w-full pointer-events-auto cursor-pointer flex flex-col transition-all duration-1000">

                <h2 id="story-title"
                    class="text-xl md:text-3xl font-bold mb-3 md:mb-5 tracking-widest drop-shadow-[0_2px_4px_rgba(0,0,0,1)] transition-colors duration-500">
                    <!-- Title gets inserted here -->
                </h2>

                <p id="story-text"
                    class="text-base md:text-xl leading-relaxed text-gray-100 font-serif whitespace-pre-line tracking-wide cursor drop-shadow-[0_2px_4px_rgba(0,0,0,1)]">
                    <!-- Typewriter text gets inserted here -->
                </p>

                <!-- Choices Area -->
                <div id="choices-container"
                    class="mt-6 flex flex-col space-y-3 opacity-0 translate-y-2 pointer-events-none transition-all duration-500">
                    <!-- Choices get inserted here -->
                </div>

            </div>
        </div>

    </div>

    <script src="js/data.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
